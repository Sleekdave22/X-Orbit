<!doctype html><meta charset="utf-8"><title>Result photo transfer check</title><style>body{background:#181818;color:white;font:16px system-ui}iframe{width:48%;height:540px;border:1px solid #777}button{padding:12px}#out{white-space:pre-wrap}</style><h1>Isolated result-photo transfer check</h1><p>Synthetic players and a generated one-pixel photo. No real match, camera or account is used.</p><button id="test">Run direct photo and cleanup check</button><pre id="debug"></pre><pre id="out">Waiting to run.</pre><iframe id="a" src="frame.html?uid=a"></iframe><iframe id="b" src="frame.html?uid=b"></iframe><script>
let state='awaiting_results',signals=[],requests=[],seq=0;const names={a:'Test player A',b:'Test player B'};
window.request=async(uid,path,body)=>{requests.push({uid,path,body});if(path.startsWith('/gamebox/result-state')){const after=Number(new URL(path,location.origin).searchParams.get('after'));return{id:'synthetic',kind:'open',a:'a',b:'b',names,state,verification:'typed',reports:state==='verified'?[{uid:'a',score_a:2,score_b:1},{uid:'b',score_a:2,score_b:1}]:[],signals:signals.filter(s=>s.uid!==uid&&s.id>after),comments:[],can_report:state==='awaiting_results'}}if(path==='/gamebox/result_signal'){signals.push({id:++seq,uid,kind:body.kind,payload:body.payload});document.getElementById('debug').textContent=signals.map(s=>s.uid+' '+s.kind+' '+s.payload.session.slice(0,8)+(s.kind==='ice'?' candidate type '+String(s.payload.value.candidate).split(' typ ')[1]?.split(' ')[0]:'')).join('\n');return{ok:true}}return{ok:true}};
document.getElementById('test').onclick=async()=>{const out=document.getElementById('out'),a=document.getElementById('a').contentWindow,b=document.getElementById('b').contentWindow;try{out.textContent='Waiting for the real WebRTC data channel…';const until=Date.now()+20000;while(a.document.querySelector('input[type=file]')?.disabled){if(Date.now()>until)throw Error('Direct channel did not connect');await new Promise(r=>setTimeout(r,100))}const bytes=Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l9sAAAAASUVORK5CYII='),c=>c.charCodeAt(0));const file=new a.File([bytes],'synthetic.png',{type:'image/png'}),input=a.document.querySelector('input[type=file]');Object.defineProperty(input,'files',{configurable:true,value:[file]});await input.onchange();out.textContent='Photo sent. Waiting for the other browser frame…';const received=Date.now()+10000;while(!b.document.querySelector('.result-photos img')){if(Date.now()>received)throw Error('No received photo');await new Promise(r=>setTimeout(r,100))}if(requests.some(r=>r.body&&(r.body.image||r.body.data||r.body.photo)))throw Error('Photo unexpectedly passed through mock backend');out.textContent='Direct WebRTC photo received. No image upload request. Confirming cleanup…';state='verified';await new Promise(r=>setTimeout(r,2500));if(a.document.querySelector('.result-photos img')||b.document.querySelector('.result-photos img'))throw Error('Temporary preview remained');out.textContent='PASS: real data-channel transfer; no photo upload; previews cleared on both peers after confirmation.'}catch(e){out.textContent='FAIL: '+e.message}};
</script>
