<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/call-screen.css"><style>body{margin:0}button{background:#921b37;color:white;border:0;position:relative;overflow:hidden}button::after{content:'';position:absolute;inset:-30% auto -30% -80%;width:45%;background:linear-gradient(90deg,transparent,#fff6,transparent);transform:skewX(-25deg)}button.pressed::after{animation:sweep .5s}@keyframes sweep{to{left:140%}}button:active{transform:scale(.97)}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){button.pressed::after{animation:none}button:active{transform:none}}</style><body><main class="call-screen"><div id="callPhoto" class="call-photo"></div><h2 id="callName">Voice call</h2><p id="callStatus">Ready</p><div id="callTimer" class="call-timer">00:00</div><div class="call-tools"><button id="muteCall" hidden>Mute</button><button id="callSpeaker" hidden>Speaker off</button><button id="callAudio" hidden>Enable audio</button></div><button id="closeCall" class="call-close" hidden>Back to chat</button><div class="call-actions"><button id="answerCall" class="call-answer" aria-label="Accept call" hidden>☎</button><button id="endCall" class="call-end" aria-label="End call"><span>☎</span></button></div></main><script src="/calls.js"></script><script src="/call-screen.js"></script><script>
const session=JSON.parse(GuardianNative.session());document.documentElement.dataset.theme=session.bright?'bright':'dark';const request=async(path,body)=>{const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+session.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Call failed');return data};const callView=new GuardianCallView({native:true,self:()=>session.id,client:()=>client,request,peer:()=>({id:session.peer,name:session.name})});const client=new GuardianVoice({self:()=>session.id,enabled:()=>!document.hidden,request,onState:s=>{callView.render(s);if(s.status==='Incoming voice call')GuardianNative.ringing();else GuardianNative.silenceRing();if(s.call)GuardianNative.activeCall(s.call.id)}});window.voiceClient=client;document.getElementById('answerCall').onclick=()=>client.accept();document.getElementById('muteCall').onclick=()=>client.mute();document.getElementById('callSpeaker').onclick=()=>callView.output();document.getElementById('callAudio').onclick=()=>client.audio.play();document.getElementById('endCall').onclick=async()=>{await client.end();GuardianNative.finished()};document.getElementById('closeCall').onclick=()=>GuardianNative.finished();if(!session.incoming)client.start(session.peer);document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b){b.classList.remove('pressed');void b.offsetWidth;b.classList.add('pressed')}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!GuardianNative.awaitingAudioPermission())client.end()});</script></body></html>
