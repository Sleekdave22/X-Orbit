<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#181818;color:white;font:18px system-ui;text-align:center;padding:30px 12px}button{background:#921b37;color:white;border:0;border-radius:20px;padding:12px 18px;margin:6px;position:relative;overflow:hidden}button:active{background:#b72b51;transform:scale(.97)}button::after{content:'';position:absolute;inset:-30% auto -30% -80%;width:45%;background:linear-gradient(90deg,transparent,#fff6,transparent);transform:skewX(-25deg)}button.pressed::after{animation:sweep .5s}@keyframes sweep{to{left:140%}}[hidden]{display:none}@media(prefers-reduced-motion:reduce){button.pressed::after{animation:none}button:active{transform:none}}</style><h2 id="name">Voice call</h2><p id="status">Ready</p><button id="accept" hidden>Accept</button><button id="mute" hidden>Mute</button><button id="audio" hidden>Enable audio</button><button id="end">End call</button><script src="/calls.js"></script><script>
const session=JSON.parse(GuardianNative.session());document.getElementById('name').textContent=session.name;const client=new GuardianVoice({self:()=>session.id,enabled:()=>!document.hidden,request:async(path,body)=>{const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+session.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Call failed');return data},onState:s=>{document.getElementById('status').textContent=s.error||s.status;document.getElementById('accept').hidden=!(s.call?.recipient===session.id&&s.call.state==='ringing');document.getElementById('mute').hidden=!client.stream;document.getElementById('mute').textContent=s.muted?'Unmute':'Mute';document.getElementById('audio').hidden=!client.stream;if(s.call)GuardianNative.activeCall(s.call.id)}});window.voiceClient=client;document.getElementById('accept').onclick=()=>client.accept();document.getElementById('mute').onclick=()=>client.mute();document.getElementById('audio').onclick=()=>client.audio.play();document.getElementById('end').onclick=()=>{client.end();GuardianNative.finished()};if(!session.incoming)client.start(session.peer);document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b){b.classList.remove('pressed');void b.offsetWidth;b.classList.add('pressed')}});document.addEventListener('visibilitychange',()=>{if(document.hidden)client.end()});</script></html>
